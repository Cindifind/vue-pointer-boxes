<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>vue-pointer-boxes · Class 引入示例</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f4f5fa;
            font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
            color: #2c2e3a;
        }

        .demo-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 40px;
            padding: 60px 40px;
        }
    </style>
</head>
<body>
<div id="app">
    <div class="vpb-box">
        <div class="demo-grid">
            <!-- 顶级 box + 子 box（父子继承演示） -->
            <div
                    style="width:220px;height:170px;border-radius:14px;background:#fff;"
                    data-dir="br"
                    data-growth-rate="3.0"
            >
                父 · 方
                <div
                        style="width:100px;height:100px;border-radius:50%;background:#f0f4ff;margin:30px auto;"
                        data-dir="tl"
                        data-growth-rate="3.2"
                >
                    子 · 圆
                </div>
            </div>

            <!-- 顶级 box -->
            <div
                    style="width:170px;height:220px;border-radius:18px;background:#fff;"
                    data-dir="tl"
                    data-growth-rate="3.4"
            >
                父 · 竖
            </div>

            <!-- 顶级 box，三级嵌套 -->
            <div
                    style="width:200px;height:200px;border-radius:100px;background:#fff;"
                    data-dir="tr"
                    data-growth-rate="2.8"
            >
                父
                <div
                        style="width:90px;height:90px;border-radius:50%;background:#fff8e1;margin:55px 0 0 55px;"
                        data-dir="down"
                        data-growth-rate="3.0"
                >
                    <div
                            style="width:40px;height:40px;border-radius:50%;background:#ffe0b2;margin:25px;"
                            data-dir="right"
                            data-growth-rate="3.5"
                    >
                        L3
                    </div>
                    L2
                </div>
            </div>
        </div>
    </div>
</div>

<script src="./dist/vue-pointer-boxes.umd.js"></script>
<script>
    VuePointerBoxes.mount('#app', {
        pointerCount: 15,
        hintText: '父绘制完 → 子才被激活',
    })
</script>
</body>
</html>
